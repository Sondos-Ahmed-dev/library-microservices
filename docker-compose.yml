# version: '3.9'

services:

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy

  auth-mysql:
    image: mysql:8
    volumes:
    - auth-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      

  book-mysql:
    image: mysql:8
    volumes:
    - book-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: book_db
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  borrow-mysql:
    image: mysql:8
    volumes:
    - borrow-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: borrow_db
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  catalog-mysql:
    image: mysql:8
    volumes:
    - catalog-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catalog_db
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    depends_on:
      auth-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  book-service:
    build: ./book-service
    ports:
      - "8083:8083"
    depends_on:
      book-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  borrow-service:
    build: ./borrow-service
    ports:
      - "8082:8082"
    depends_on:
      borrow-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  catalog-service:
    build: ./catalog-service
    ports:
      - "8084:8084"
    depends_on:
      catalog-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8090:80"
    environment:
      PMA_HOSTS: auth-mysql,book-mysql,borrow-mysql,catalog-mysql
      PMA_USER: root
      PMA_PASSWORD: root      

volumes:
  auth-db:
  book-db:  
  borrow-db:
  catalog-db:  
